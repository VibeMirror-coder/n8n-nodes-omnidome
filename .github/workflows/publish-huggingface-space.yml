name: Publish OmniDome Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - integrations/huggingface-space/**
      - scripts/publish_huggingface_space.py
      - .github/workflows/publish-huggingface-space.yml
permissions:
  contents: read
jobs:
  publish-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned publishing client
        run: python -m pip install --disable-pip-version-check --no-input huggingface_hub==2.4.0
      - name: Create or update the public static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_huggingface_space.py
