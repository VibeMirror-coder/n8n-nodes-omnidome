name: HumanMirror public A2A revalidation (once)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agenstry-a2a-refresh-once.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for the live A2A v1 response envelope
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":"hm-a2a-gate-20261111","method":"SendMessage","params":{"message":{"kind":"message","messageId":"hm-a2a-gate","role":"ROLE_USER","parts":[{"kind":"text","text":"heartbeat"}]}}}'
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 15 -X POST 'https://humanmirror.fr/api/a2a/' -H 'A2A-Version: 1.0' -H 'Content-Type: application/json' --data "$payload" -o /tmp/a2a-live.json && jq -e '.result.message.role == "ROLE_AGENT" and (.result.task == null) and (.result.message.contextId | type == "string")' /tmp/a2a-live.json >/dev/null; then
              echo 'A2A_V1_PRODUCTION_ENVELOPE=PASS'
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'A2A_V1_PRODUCTION_ENVELOPE=FAIL'
              exit 1
            fi
            sleep 5
          done
      - name: Ask Agenstry free validator to re-probe HumanMirror
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/validate-request.json <<'JSON'
          {
            "jsonrpc":"2.0",
            "id":"humanmirror-free-validation-20261111",
            "method":"SendMessage",
            "params":{
              "message":{
                "messageId":"humanmirror-free-validation-request",
                "role":"ROLE_USER",
                "parts":[{"text":"validate: https://humanmirror.fr"}]
              }
            }
          }
          JSON
          status="$(curl --silent --show-error --max-time 30 \
            --output /tmp/agenstry-result.json \
            --write-out '%{http_code}' \
            --request POST 'https://agenstry.com/a2a' \
            --header 'Content-Type: application/json' \
            --header 'A2A-Version: 1.0' \
            --data-binary @/tmp/validate-request.json)"
          echo "AGENSTRY_VALIDATION_HTTP=$status"
          if [ "$status" != "200" ]; then
            echo "Free revalidation did not complete; no paid retry or charge attempted."
            exit 1
          fi
          jq -e '.jsonrpc == "2.0" and .id == "humanmirror-free-validation-20261111" and (.error == null)' /tmp/agenstry-result.json >/dev/null
          jq -c '{jsonrpc,id,result_type:(.result|type),parts:(.result.parts // .result.message.parts // [] | map({text:(.text // "")[:1200]}))}' /tmp/agenstry-result.json
          jq -r '.result.parts[]? | select(.text != null) | .text' /tmp/agenstry-result.json > /tmp/agenstry-observation.json
          jq -c '{card_status:.status_code, live_state, live_responds, conformance:.conformance.score, grade:.conformance.grade}' /tmp/agenstry-observation.json
          if ! jq -e '.live_responds == true and (.conformance.score >= 75)' /tmp/agenstry-observation.json >/dev/null; then
            echo 'AGENT_CONFORMANCE_EXTERNAL=FAIL (do not claim interoperability fixed)'
            exit 1
          fi
          echo 'AGENT_CONFORMANCE_EXTERNAL=PASS (reported by independent directory, not paid customer traffic)'
